<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox</title>
    <link rel="stylesheet" href="anmelden.css">
</head>
<body>
    <div class="main-content">
        <h2>Anmelden</h2>
        <form >
            <label for="Username">Benutzername</label>
            <input type="text" id="Username" placeholder="Dein Benutzername" required>
            
            <label for="Password">Passwort</label>
            <input type="password" id="Password" placeholder="••••••••" required>
            
            <button type="submit" class="btn-submit" onclick="Einloggen()">Konto erstellen</button>
            <p hidden id="Info-login"></p>
            <a href="registrieren.htm">Du hast noch kein Konto? Registrieren</a>
        </form>
    </div>
    <script src="../script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Das Haupt-Layout, das die Sidebar links und den Inhalt rechts anordnet -->
    <div class="container">
        
        <!-- 1. SIDEBAR (Ganz links) -->
        <aside class="sidebar">
            <h2>Menü</h2>
            <ul>
                <li><a href="start.htm" title="Startseite">🏠</a></li>
                <li><a href="#" title="Dateien">📁</a></li>
                <li><a href="#" title="Suche">🔍</a></li>
                <li><a href="#" title="Profil">👤</a></li>
                <li><a href="#" title="Einstellungen">⚙️</a></li>
            </ul>
        </aside>

        <!-- 2. ARBEITSBEREICH (Rechts neben der Sidebar) -->
        <main class="main-content">
            
            <!-- Code-Eingabe Box -->
            <div id="code_eingabe_div">
                <button id="code_eingabe_button" onclick="send()">✅</button>
                <textarea name="code_eingabe" id="editor" placeholder="Dein Code" autofocus></textarea>
            </div>

            <div id="buttons_div">
                <button onclick="openTerminal()">🔼</button>
                <button onclick="closeTerminal()">🔽</button>
                <button onclick="clearTerminal()">🗑️</button>
            </div>

            <!-- Terminal Box (Bleibt standardmäßig über 'hidden' unsichtbar) -->
            <div id="terminal_div" hidden>
                <textarea name="terminal" id="terminal" readonly></textarea>
            </div>
            
        </main>
        
    </div>

    <!-- Script am Ende des Bodys laden, damit alle HTML-Elemente beim Ausführen bereits existieren -->
    <script src="script.js"></script>
</body>
</html>
